server:
  port: 8085

spring:
  application:
    name: task2kyc

  datasource:
    url: jdbc:postgresql://localhost:5432/kycdb
    username: user
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

application:
  blocking:
    lease-duration: 30s
  batch-size: 20

outbox:
  poll-delay: 5000

logging:
  level:
    org.hibernate.SQL: DEBUG
