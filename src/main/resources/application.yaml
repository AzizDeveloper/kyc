server:
  port: 8085

spring:
  application:
    name: task2kyc

  datasource:
    url: jdbc:postgresql://localhost:5432/applications_db
    username: user
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

application:
  blocking:
    lease-duration: 30s